name: Build GEEZ Reverb VST3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build VST3 on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Reverb project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path extracted
          Expand-Archive -Path GeezReverbV1.zip -DestinationPath extracted -Force

      - name: Find CMake project
        shell: pwsh
        run: |
          $cmake = Get-ChildItem -Path extracted -Filter CMakeLists.txt -Recurse | Select-Object -First 1
          
          if (-not $cmake) {
            Write-Error "CMakeLists.txt não encontrado dentro do GeezReverbV1.zip"
            exit 1
          }

          Write-Host "CMake encontrado em: $($cmake.Directory.FullName)"
          "SOURCE_DIR=$($cmake.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S "$env:SOURCE_DIR" -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel

      - name: Find generated VST3
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path . -Filter *.vst3 -Recurse

          if (-not $vst3) {
            Write-Error "Nenhum arquivo .vst3 foi encontrado após o build."
            exit 1
          }

          Write-Host "VST3 encontrado:"
          $vst3 | ForEach-Object {
            Write-Host $_.FullName
          }

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Geez-Reverb-VST3
          path: |
            **/*.vst3
